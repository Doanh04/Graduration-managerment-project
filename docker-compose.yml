services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-doanh@123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-graduration-managerment}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-doanh@123}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./server-springboot
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-graduration-managerment}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-doanh@123}
      # MONGO_URI phải là URI đã URL-encode mật khẩu (ví dụ @ thành %40).
      # Giá trị mặc định tương ứng với tài khoản local hiện tại: doanh@123.
      SPRING_DATA_MONGODB_URI: ${MONGO_URI:-mongodb://admin:doanh%40123@mongodb:27017/graduration_managerment?authSource=admin}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      APP_STORAGE_ROOT: /app/storage
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    volumes:
      - ./storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./client-react/graduration-client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /graduration
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
  mongo_data:
